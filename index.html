<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Notion Weather Card - Lining Serif</title>
    <!-- Import Lora with full weight range -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Primary: Lora with fallback to standard lining serifs */
            font-family: 'Lora', Century Schoolbook, Millinery, Georgia, serif;
            /* Enforces uniform baseline alignment (lining-nums) and equal widths (tabular-nums) */
            font-variant-numeric: lining-nums tabular-nums;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            overflow: hidden;
            font-feature-settings: 'lnum' 1, 'tnum' 1;
        }

        .card {
            width: 100%;
            height: 100%;
            padding: 16px 22px;
            border-radius: 0px; /* Non-rounded edges */
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            background: linear-gradient(135deg, #2b7fff, #1a5bb8);
            transition: background 1s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .date-text {
            font-size: 0.77rem;
            font-weight: 500;
            letter-spacing: 0.2px;
            opacity: 0.92;
        }

        .time-text {
            font-size: 2.53rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1;
            margin: 2px 0;
        }

        .location-text {
            font-size: 0.7rem;
            font-weight: 400;
            opacity: 0.88;
        }

        .right-col {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .weather-icon-container {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weather-icon-container svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.15));
        }

        .temp-text {
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: -0.5px;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div class="left-col">
            <div class="date-text" id="date">Loading...</div>
            <div class="time-text" id="time">00:00</div>
            <div class="location-text" id="location">Courtenay, BC</div>
        </div>
        <div class="right-col">
            <div class="weather-icon-container" id="icon"></div>
            <div class="temp-text" id="temp">--°</div>
        </div>
    </div>

    <script>
        const svgIcons = {
            sun: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
            moon: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
            cloudSun: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M19.07 4.93l-1.41 1.41"/><path d="M15.9 12a5 5 0 1 0-9.8 0 4 4 0 0 0 1.9 7.6h11a3.5 3.5 0 0 0 0-7c-.3 0-.6.04-.9.12z"/></svg>`,
            cloudMoon: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2a9 9 0 0 0-3 5.3 4.5 4.5 0 0 0 1 8.7h10a3.5 3.5 0 0 0 0-7c-.3 0-.6.04-.9.12A9 9 0 0 0 13 2z"/></svg>`,
            cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 3 16.3h15a5 5 0 0 0 0-10z"/></svg>`,
            rain: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v6M8 13v6M12 15v6"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>`,
            snow: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="8" y1="20" x2="8.01" y2="20"/><line x1="12" y1="18" x2="12.01" y2="18"/><line x1="16" y1="16" x2="16.01" y2="16"/><line x1="16" y1="20" x2="16.01" y2="20"/></svg>`,
            thunderstorm: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><polyline points="13 11 9 17 15 17 11 23"/></svg>`,
            fog: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="5" y1="18" x2="19" y2="18"/><line x1="5" y1="6" x2="19" y2="6"/></svg>`
        };

        function updateTimeAndDate() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').innerText = `${hours}:${minutes}`;

            const options = { weekday: 'long', month: 'long', day: '2-digit' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateTimeAndDate, 1000);
        updateTimeAndDate();

        async function fetchWeather() {
            try {
                const lat = 49.6866;
                const lon = -124.9936;
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;

                const response = await fetch(url);
                const data = await response.json();
                
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                const isDay = data.current_weather.is_day === 1;

                document.getElementById('temp').innerText = `${temp}°`;

                let themeGradient = 'linear-gradient(135deg, #2b7fff, #1a5bb8)';
                let selectedIcon = svgIcons.sun;

                if (code === 0) {
                    if (isDay) {
                        themeGradient = 'linear-gradient(135deg, #2575fc, #1a5bb8)';
                        selectedIcon = svgIcons.sun;
                    } else {
                        themeGradient = 'linear-gradient(135deg, #0f172a, #1e293b)';
                        selectedIcon = svgIcons.moon;
                    }
                } else if (code >= 1 && code <= 2) {
                    if (isDay) {
                        themeGradient = 'linear-gradient(135deg, #3b82f6, #1d4ed8)';
                        selectedIcon = svgIcons.cloudSun;
                    } else {
                        themeGradient = 'linear-gradient(135deg, #1e293b, #334155)';
                        selectedIcon = svgIcons.cloudMoon;
                    }
                } else if (code === 3) {
                    themeGradient = 'linear-gradient(135deg, #475569, #334155)';
                    selectedIcon = svgIcons.cloud;
                } else if (code === 45 || code === 48) {
                    themeGradient = 'linear-gradient(135deg, #52525b, #3f3f46)';
                    selectedIcon = svgIcons.fog;
                } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
                    themeGradient = 'linear-gradient(135deg, #1e3a8a, #0f172a)';
                    selectedIcon = svgIcons.rain;
                } else if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) {
                    themeGradient = 'linear-gradient(135deg, #0284c7, #0369a1)';
                    selectedIcon = svgIcons.snow;
                } else if (code >= 95) {
                    themeGradient = 'linear-gradient(135deg, #311b92, #1a237e)';
                    selectedIcon = svgIcons.thunderstorm;
                }

                document.getElementById('card').style.background = themeGradient;
                document.getElementById('icon').innerHTML = selectedIcon;

            } catch (err) {
                document.getElementById('temp').innerText = '--°';
                document.getElementById('icon').innerHTML = svgIcons.cloud;
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 1800000);
    </script>
</body>
</html>
